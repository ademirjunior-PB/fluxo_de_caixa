<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caixa e Estoque</title>
<style>
:root{--bg:#f3f1ec;--c:#fffefb;--t:#1f2a2e;--m:#6c7a7f;--p:#0f766e;--g:#15803d;--r:#b91c1c;--b:#ddd8cd}
@media(prefers-color-scheme:dark){:root{--bg:#121a1c;--c:#1b2528;--t:#e8efef;--m:#8fa0a4;--p:#2dd4bf;--g:#4ade80;--r:#f87171;--b:#2c3a3e}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t)}
main{max-width:820px;margin:auto;padding:16px 14px 96px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px;margin:0 0 12px}
h2{margin:2px 0 10px;font-size:18px}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t);max-width:100%}
button{background:var(--p);color:var(--bg);border:0;cursor:pointer;font-weight:600}
button.s{background:transparent;color:var(--r);padding:4px 8px}
button.o{background:transparent;color:var(--p);border:1px solid var(--p)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1 1 140px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi b{display:block;font-size:18px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--b)}
.m{color:var(--m);font-size:13px}.e{color:var(--g)}.sa{color:var(--r)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--m);border-radius:0;padding:15px 4px}
nav button.on{color:var(--p);box-shadow:inset 0 2px var(--p)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// COLE AQUI a configuração do seu app web (Firebase Console > Configurações do projeto > Seus apps)
const FB={apiKey:'COLE',authDomain:'COLE.firebaseapp.com',projectId:'COLE',appId:'COLE'};

firebase.initializeApp(FB);
const fa=firebase.auth(),db=firebase.firestore();
let U=null,D={insumos:[],produtos:[],lanc:[]},tab='resumo',mes=new Date().toISOString().slice(0,7),rasc=[],dn='',dp='',tm;
const dirty=new Set();
const $=i=>document.getElementById(i),uid=()=>crypto.randomUUID();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=id=>parseFloat(String($(id).value).replace(',','.'))||0;
const P=m=>parseFloat((prompt(m)||'').replace(',','.'))||0;
const today=()=>new Date().toISOString().slice(0,10);
const r3=x=>Math.round(x*1000)/1000,r2=x=>Math.round(x*100)/100;
const sum=(L,t)=>L.filter(l=>l.tipo==t).reduce((a,l)=>a+l.valor,0);
const nomeI=id=>D.insumos.find(i=>i.id==id)?.nome||'?';
const custoP=p=>p.rec.reduce((a,r)=>a+r.q*(D.insumos.find(i=>i.id==r.id)?.cu||0),0);
const ref=()=>db.collection('users').doc(U.uid);

// Estoque fica em users/{uid}/estoque/main; cada mês fica em users/{uid}/meses/AAAA-MM
function save(){
  clearTimeout(tm);
  tm=setTimeout(async()=>{
    if($('st'))$('st').textContent='Salvando…';
    try{
      const b=db.batch(),meses=[...dirty];
      b.set(ref().collection('estoque').doc('main'),{insumos:D.insumos,produtos:D.produtos});
      meses.forEach(m=>b.set(ref().collection('meses').doc(m),{lanc:D.lanc.filter(l=>l.data.startsWith(m))}));
      await b.commit();meses.forEach(m=>dirty.delete(m));
      if($('st'))$('st').textContent='Salvo ✓';
    }catch(e){if($('st'))$('st').textContent='Erro ao salvar: '+e.message}
  },500);
}
const act=f=>{f();render();save()};
const addLanc=(tipo,desc,valor,data,x={})=>{D.lanc.push({id:uid(),tipo,desc,valor:r2(valor),data,...x});dirty.add(data.slice(0,7))};
const delL=id=>act(()=>{const l=D.lanc.find(x=>x.id==id);dirty.add(l.data.slice(0,7));D.lanc=D.lanc.filter(x=>x.id!=id)});
const del=(k,id)=>act(()=>D[k]=D[k].filter(x=>x.id!=id));

const MSG={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/email-already-in-use':'Este e-mail já tem conta.','auth/weak-password':'A senha precisa ter 6 ou mais caracteres.','auth/invalid-email':'E-mail inválido.','auth/missing-password':'Digite a senha.'};
async function entrar(novo){
  try{const e=$('em').value,p=$('pw').value;
    novo?await fa.createUserWithEmailAndPassword(e,p):await fa.signInWithEmailAndPassword(e,p)}
  catch(x){$('msg').textContent=MSG[x.code]||x.message}
}
async function esqueci(){
  const e=$('em').value;if(!e){$('msg').textContent='Digite seu e-mail acima.';return}
  try{await fa.sendPasswordResetEmail(e);$('msg').textContent='Enviamos um link de redefinição para o seu e-mail.'}
  catch(x){$('msg').textContent=MSG[x.code]||x.message}
}
fa.onAuthStateChanged(u=>{U=u;load()});
async function load(){
  D={insumos:[],produtos:[],lanc:[]};dirty.clear();
  if(U){try{
    const e=await ref().collection('estoque').doc('main').get();
    if(e.exists){D.insumos=e.data().insumos||[];D.produtos=e.data().produtos||[]}
    const s=await ref().collection('meses').get();
    s.forEach(d=>D.lanc.push(...(d.data().lanc||[])));
  }catch(x){alert('Erro ao carregar os dados: '+x.message)}}
  render();
}

// Caixa
const addL=()=>{const v=num('lv');if(!v)return;
  act(()=>addLanc($('lt').value,$('ld').value||'Sem descrição',v,$('ldt').value||today()))};
// Insumos
const addI=()=>{const n=$('in').value.trim(),q=num('iq'),c=num('ic'),m=num('im');if(!n)return;
  act(()=>{D.insumos.push({id:uid(),nome:n,un:$('iu').value||'un',qtd:q,min:m,cu:c&&q?c/q:0});if(c)addLanc('saida','Compra: '+n,c,today())})};
const compra=id=>{const i=D.insumos.find(x=>x.id==id),q=P('Quantidade comprada de '+i.nome+'?');if(!q)return;
  const c=P('Valor total pago (R$)? Deixe vazio para não lançar no caixa');
  act(()=>{i.qtd=r3(i.qtd+q);if(c){i.cu=c/q;addLanc('saida','Compra: '+i.nome,c,today())}})};
const ajustar=id=>{const i=D.insumos.find(x=>x.id==id);
  const q=prompt('Quantidade real em estoque de '+i.nome+':',i.qtd);if(q===null)return;
  const m=prompt('Avisar quando chegar em (estoque mínimo):',i.min||0);if(m===null)return;
  act(()=>{i.qtd=parseFloat(q.replace(',','.'))||0;i.min=parseFloat(m.replace(',','.'))||0})};
// Produtos
const addR=()=>{const q=num('rq');if(!q||!$('rs').value)return;dn=$('pn').value;dp=$('pp').value;rasc.push({id:$('rs').value,q});render()};
const addP=()=>{const n=$('pn').value.trim();if(!n)return;
  act(()=>{D.produtos.push({id:uid(),nome:n,preco:num('pp'),est:0,rec:rasc});rasc=[];dn=dp=''})};
const prodz=id=>{const p=D.produtos.find(x=>x.id==id),n=P('Quantas unidades de '+p.nome+' você produziu?');if(!n)return;
  const falta=p.rec.filter(r=>(D.insumos.find(i=>i.id==r.id)?.qtd||0)<r.q*n).map(r=>nomeI(r.id));
  if(falta.length)return alert('Estoque insuficiente de: '+falta.join(', '));
  act(()=>{p.rec.forEach(r=>{const i=D.insumos.find(x=>x.id==r.id);i.qtd=r3(i.qtd-r.q*n)});p.est+=n})};
const vend=id=>{const p=D.produtos.find(x=>x.id==id),n=P('Quantas unidades vendidas?');if(!n)return;
  if(p.est<n)return alert('Só há '+p.est+' em estoque');
  act(()=>{p.est-=n;addLanc('entrada','Venda: '+n+'× '+p.nome,p.preco*n,today(),{pid:p.id,n,cu:custoP(p)})})};
// Exportar para planilha (CSV abre no Excel e no Google Planilhas)
const csv=(nome,rows)=>{const t='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=nome;a.click()};
const vir=x=>String(x).replace('.',',');
const expCaixa=()=>csv('caixa-'+mes+'.csv',[['Data','Tipo','Descrição','Valor']].concat(
  D.lanc.filter(l=>l.data.startsWith(mes)).sort((a,b)=>a.data.localeCompare(b.data)).map(l=>[l.data,l.tipo,l.desc,vir(l.valor)])));
const expEstoque=()=>csv('estoque.csv',[['Item','Tipo','Quantidade','Unidade']].concat(
  D.insumos.map(i=>[i.nome,'Insumo',vir(i.qtd),i.un]),D.produtos.map(p=>[p.nome,'Produto pronto',p.est,'un'])));

const mesIn=()=>`<input type="month" value="${mes}" onchange="mes=this.value;render()">`;
const V={
resumo:()=>{const L=D.lanc.filter(l=>l.data.startsWith(mes)),e=sum(L,'entrada'),s=sum(L,'saida');
 const baixo=D.insumos.filter(i=>i.min&&i.qtd<=i.min);
 const vp=D.produtos.map(p=>{const v=L.filter(l=>l.pid==p.id);return{p,n:v.reduce((a,l)=>a+l.n,0),rec:sum(v,'entrada'),luc:sum(v,'entrada')-v.reduce((a,l)=>a+l.n*l.cu,0)}}).filter(x=>x.n);
 return `<div class="card">${mesIn()}<div class="kpi"><div><span class="m">Entradas</span><b class="e">${R(e)}</b></div><div><span class="m">Saídas</span><b class="sa">${R(s)}</b></div><div><span class="m">Saldo</span><b>${R(e-s)}</b></div></div></div>
 ${baixo.length?`<div class="card"><h2 class="sa">Repor estoque</h2>${baixo.map(i=>`<div class="it"><span>${esc(i.nome)}</span><b class="sa">${i.qtd} ${esc(i.un)} (mín. ${i.min})</b></div>`).join('')}</div>`:''}
 <div class="card"><h2>Lucro por produto no mês</h2>${vp.map(x=>`<div class="it"><span>${esc(x.p.nome)}<br><span class="m">${x.n} vendidos · receita ${R(x.rec)}</span></span><b class="${x.luc>=0?'e':'sa'}">${R(x.luc)}</b></div>`).join('')||'<span class="m">Nenhuma venda de produto neste mês. Use o botão Vender na aba Produtos.</span>'}</div>
 <div class="card"><h2>Estoque atual</h2>${D.insumos.map(i=>`<div class="it"><span>${esc(i.nome)}</span><b>${i.qtd} ${esc(i.un)}</b></div>`).join('')}${D.produtos.map(p=>`<div class="it"><span>${esc(p.nome)} (pronto)</span><b>${p.est} un</b></div>`).join('')}${D.insumos.length+D.produtos.length?'':'<span class="m">Cadastre insumos e produtos nas abas abaixo.</span>'}</div>`},
lanc:()=>{const L=D.lanc.filter(l=>l.data.startsWith(mes)).sort((a,b)=>b.data.localeCompare(a.data));
 return `<div class="card"><h2>Novo lançamento</h2><div class="row"><select id="lt"><option value="entrada">Entrada</option><option value="saida">Saída</option></select><input id="ld" placeholder="Descrição"><input id="lv" type="number" step="0.01" placeholder="Valor"><input id="ldt" type="date" value="${today()}"></div><button onclick="addL()">Adicionar</button></div>
 <div class="card"><div class="row">${mesIn()}<button class="o" onclick="expCaixa()">Exportar mês (CSV)</button></div>${L.map(l=>`<div class="it"><span>${l.data.slice(8)}/${l.data.slice(5,7)} · ${esc(l.desc)}</span><span class="${l.tipo=='entrada'?'e':'sa'}">${l.tipo=='entrada'?'+':'−'}${R(l.valor)} <button class="s" onclick="delL('${l.id}')">✕</button></span></div>`).join('')||'<p class="m">Nenhum lançamento neste mês.</p>'}</div>`},
ins:()=>`<div class="card"><h2>Novo insumo</h2><div class="row"><input id="in" placeholder="Nome (ex.: Base de botom 32mm)"><input id="iu" placeholder="Unidade (un, g, m)"><input id="iq" type="number" step="any" placeholder="Quantidade em estoque"><input id="ic" type="number" step="0.01" placeholder="Valor pago (opcional)"><input id="im" type="number" step="any" placeholder="Estoque mínimo (opcional)"></div><button onclick="addI()">Cadastrar insumo</button></div>
 <div class="card"><div class="row"><button class="o" onclick="expEstoque()">Exportar estoque (CSV)</button></div>${D.insumos.map(i=>`<div class="it"><span>${esc(i.nome)}<br><span class="m ${i.min&&i.qtd<=i.min?'sa':''}">${i.qtd} ${esc(i.un)}${i.min?' · mín. '+i.min:''}${i.cu?' · '+R(i.cu)+'/'+esc(i.un):''}</span></span><span><button onclick="compra('${i.id}')">+ Comprar</button> <button class="o" onclick="ajustar('${i.id}')">Ajustar</button> <button class="s" onclick="del('insumos','${i.id}')">✕</button></span></div>`).join('')||'<span class="m">Nenhum insumo cadastrado.</span>'}</div>`,
prod:()=>`<div class="card"><h2>Novo produto</h2><div class="row"><input id="pn" placeholder="Nome (ex.: Botom 32mm)" value="${esc(dn)}"><input id="pp" type="number" step="0.01" placeholder="Preço de venda" value="${esc(dp)}"></div><div class="m">Insumos gastos por unidade produzida:</div><div class="row"><select id="rs">${D.insumos.map(i=>`<option value="${i.id}">${esc(i.nome)}</option>`).join('')}</select><input id="rq" type="number" step="any" placeholder="Qtd"><button onclick="addR()">+ Adicionar</button></div>${rasc.map(r=>`<div class="m">• ${esc(nomeI(r.id))}: ${r.q}</div>`).join('')}<div class="row"><button onclick="addP()">Salvar produto</button></div></div>
 <div class="card">${D.produtos.map(p=>{const c=custoP(p),l=p.preco-c;return `<div class="it"><span>${esc(p.nome)} · ${R(p.preco)}<br><span class="m">Estoque pronto: ${p.est} un · custo ${R(c)} · lucro ${R(l)}${p.preco?' ('+Math.round(l/p.preco*100)+'%)':''}</span></span><span><button onclick="prodz('${p.id}')">Produzir</button> <button onclick="vend('${p.id}')">Vender</button> <button class="s" onclick="del('produtos','${p.id}')">✕</button></span></div>`}).join('')||'<span class="m">Nenhum produto cadastrado.</span>'}</div>`
};
function render(){
  const A=$('app');
  if(!U){A.innerHTML=`<div class="card"><h2>Caixa e Estoque</h2><div class="row"><input id="em" type="email" placeholder="E-mail" autocomplete="email"><input id="pw" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password"></div><div class="row"><button onclick="entrar(0)">Entrar</button><button class="o" onclick="entrar(1)">Criar conta</button></div><button class="s" onclick="esqueci()">Esqueci a senha</button><p id="msg" class="sa"></p></div>`;$('nav').innerHTML='';return}
  $('nav').innerHTML=[['resumo','Resumo'],['lanc','Caixa'],['ins','Insumos'],['prod','Produtos']].map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('');
  A.innerHTML=`<div class="row"><span class="m" id="st"></span><button style="flex:0 0 auto" onclick="fa.signOut()">Sair</button></div>`+V[tab]();
}
render();
</script>
</body>
</html>
